manifestVersion: 1
id: fgilde-webdatastudio
category: developer
name: WebDataStudio
version: "1.3.0"
tagline: A database studio that runs in your browser
description: >-
  WebDataStudio is a database client that lives on your server instead of on one laptop:
  PostgreSQL, MySQL/MariaDB, SQL Server, SQLite, Oracle, DuckDB, ClickHouse, MongoDB and Redis,
  all from a browser tab.


  Explore a schema, write SQL with completion and history, or build a query visually without
  writing any. Results become charts, ER diagrams draw themselves from the foreign keys, two
  connections can be compared column by column, and schema edits happen in the UI instead of in
  DDL typed from memory. Queries can be saved, scheduled and exported, and an MCP endpoint lets an
  AI agent query the same connections under the same rules.


  ✨ FEATURES


  - Nine engines in one container, added in the UI or handed in as WDS_CONN_<NAME> variables

  - SQL editor with completion, history and saved queries

  - Visual query builder, result charts and ER diagrams

  - Schema editing and a column-by-column comparison between two connections

  - Read-only connections, enforced in the driver rather than only in the interface

  - Scheduled queries with file export, and an MCP endpoint for AI agents


  🔐 LOGIN


  Umbrel generates the password shown on this page and hands it to the app; the user name is
  `admin`. Without a user and password the studio has no login screen at all, which is why this
  package always sets both.
