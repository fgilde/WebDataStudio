name: Release binaries

# Self-contained desktop builds of the same server. Run it and it opens a browser tab; the
# container image stays the primary way to deploy WebDataStudio.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            os: windows-latest
            archive: zip
          - runtime: win-arm64
            os: windows-latest
            archive: zip
          - runtime: linux-x64
            os: ubuntu-latest
            archive: tar
          - runtime: linux-arm64
            os: ubuntu-latest
            archive: tar
          - runtime: osx-x64
            os: macos-latest
            archive: tar
          - runtime: osx-arm64
            os: macos-latest
            archive: tar

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # GitHub's expressions have no substring, so the tag is stripped here. Absent on a branch
      # build, which leaves the version as the run number.
      - name: Version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "WDS_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Self-contained so the download needs no .NET on the machine. Trimming stays off: the
      # database drivers reach for types through reflection.
      - name: Publish
        run: >
          dotnet publish src/WebDataStudio.Server
          -c Release
          -r ${{ matrix.runtime }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:WdsDesktop=true
          -p:WdsBuild=${{ github.run_number }}
          -p:WdsCommit=${{ github.sha }}
          -p:WdsVersion=${{ env.WDS_VERSION }}
          -o publish/${{ matrix.runtime }}

      - name: Default to opening a browser
        shell: bash
        run: |
          cat > publish/${{ matrix.runtime }}/README.txt <<'TXT'
          WebDataStudio — desktop build

          Start the binary. It serves the studio on http://localhost:8080 and opens it in a window
          of its own, without an address bar, using the platform's web view: WebView2 on Windows,
          WKWebView on macOS, WebKitGTK on Linux (install libwebkit2gtk if it is missing).

          If that window cannot open, the studio falls back to an installed Chromium in app mode
          and then to a normal browser tab, and says which in its log.

          Everything it stores lives next to the binary in ./data.

          WDS_APP_WINDOW=false    open a normal browser tab instead of a window
          WDS_OPEN_BROWSER=false  open nothing; visit the address yourself
          ASPNETCORE_URLS         listen somewhere else
          WDS_CONN_<NAME>         attach a connection at startup

          The studio is also installable from any browser that has it open — "Install
          WebDataStudio" in the address bar or the browser menu — which is the same window
          without downloading anything.
          TXT

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.runtime }}/* -DestinationPath webdatastudio-${{ matrix.runtime }}.zip

      - name: Archive (tar)
        if: matrix.archive == 'tar'
        run: tar -czf webdatastudio-${{ matrix.runtime }}.tar.gz -C publish/${{ matrix.runtime }} .

      - uses: actions/upload-artifact@v4
        with:
          name: webdatastudio-${{ matrix.runtime }}
          path: webdatastudio-${{ matrix.runtime }}.*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
