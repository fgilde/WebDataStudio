# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: WebDataStudio
description: "The server that hosts the studio UI and its APIs."

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download

setup:
  - run: dotnet restore

tasks:
  - name: app
    run: dotnet run --project src/WebDataStudio.Server --urls http://localhost:5080
    readyWhen: {http: "http://localhost:5080"}
    open: true
